<!doctype html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>운영자 관리 · 연구하는 교사되기 2027</title>
<link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square-neo.css">
<style>
:root {
  --navy: #001871; --navy-deep: #0E152D; --ink: #111; --ink-2: #333; --gray-1: #666; --gray-2: #777;
  --line: #ddd; --bg-soft: #f5f5f5; --danger: #d6001c; --ok: #0a7a3f;
  /* 문자 화면(JVI 톤) */
  --violet: #7a3cff; --violet-2: #5a2ee0; --lav: #f4f0ff; --lav-2: #ebe4ff; --jnavy: #0b1033; --jnavy-2: #1b2150; --cell: #f7f7fb; --muted: #6b6f86;
}
* { box-sizing: border-box; }
body { margin: 0; background: #f3f4f7; color: var(--ink); font-family: "NanumSquareNeo", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 15px; line-height: 1.6; word-break: keep-all; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
.top { background: var(--navy); color: #fff; height: 56px; display: flex; align-items: center; padding: 0 20px; gap: 16px; position: sticky; top: 0; z-index: 30; }
.top b { font-size: 17px; font-weight: 800; letter-spacing: -.02em; }
.top b em { font-style: normal; opacity: .7; font-weight: 400; margin-left: 6px; font-size: 13px; }
.top .sp { flex: 1; }
.top a, .top span { font-size: 13px; opacity: .9; }
.top .pill { height: 30px; padding: 0 16px; border-radius: 30px; background: rgba(255,255,255,.14); display: inline-flex; align-items: center; text-decoration: none; }
.layout { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 56px); }
.side { background: #fff; border-right: 1px solid var(--line); padding: 16px 0; position: sticky; top: 56px; height: calc(100vh - 56px); overflow: auto; }
.side .grp { font-size: 11px; color: var(--gray-2); letter-spacing: .12em; padding: 14px 22px 6px; }
.side button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 11px 22px; text-align: left; cursor: pointer; font-weight: 700; color: var(--ink-2); border-left: 3px solid transparent; }
.side button:hover { background: var(--bg-soft); }
.side button.on { color: var(--navy); background: #eef1fb; border-left-color: var(--navy); }
.side .cnt { margin-left: auto; background: var(--danger); color: #fff; border-radius: 20px; font-size: 11px; padding: 0 7px; line-height: 18px; }
main { padding: 28px 32px 80px; min-width: 0; }
h2 { font-size: 24px; font-weight: 800; margin: 0 0 4px; letter-spacing: -.02em; }
.sub { color: var(--gray-1); font-size: 14px; margin: 0 0 22px; }
.card { background: #fff; border: 1px solid var(--line); padding: 20px 22px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.stat { background: #fff; border: 1px solid var(--line); border-top: 3px solid var(--navy); padding: 16px 18px; cursor: pointer; }
.stat small { color: var(--gray-1); font-size: 13px; }
.stat b { display: block; font-size: 30px; font-weight: 800; color: var(--navy); line-height: 1.3; }
.stat b span { font-size: 14px; color: var(--gray-2); font-weight: 400; margin-left: 4px; }
.stat.warn { border-top-color: var(--danger); } .stat.warn b { color: var(--danger); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.toolbar .grow { flex: 1; }
input[type=text], input[type=search], select, textarea { height: 40px; padding: 0 12px; border: 1px solid #ccc; background: #fff; border-radius: 0; }
textarea { height: auto; padding: 10px 12px; width: 100%; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--navy); outline-offset: -1px; }
.btn { height: 40px; padding: 0 18px; border: 1px solid var(--ink-2); background: var(--ink-2); color: #fff; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn.navy { background: var(--navy); border-color: var(--navy); }
.btn.line { background: #fff; color: var(--ink-2); }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; }
.btn.red { background: #fff; color: var(--danger); border-color: var(--danger); }
.btn.ok { background: var(--ok); border-color: var(--ok); }
.btn[disabled] { opacity: .5; cursor: progress; }
.tbl-wrap { background: #fff; border: 1px solid var(--line); overflow: auto; max-height: 68vh; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { position: sticky; top: 0; background: var(--bg-soft); border-bottom: 2px solid var(--ink); text-align: left; padding: 10px 12px; white-space: nowrap; font-weight: 800; z-index: 1; }
.tbl td { border-bottom: 1px solid var(--line); padding: 9px 12px; white-space: nowrap; max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
.tbl tr.click { cursor: pointer; } .tbl tr.click:hover td { background: #f7f9ff; }
.badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border: 1px solid currentColor; }
.b-ok { color: var(--ok); } .b-red { color: var(--danger); } .b-navy { color: var(--navy); } .b-gray { color: var(--gray-2); }
.muted { color: var(--gray-2); font-size: 13px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.row-actions { display: flex; gap: 6px; }
.empty { padding: 40px; text-align: center; color: var(--gray-2); }
.dup { display: inline-block; margin-left: 4px; font-size: 11px; font-weight: 800; color: #b45309; background: #fff4e0; border: 1px solid #f6c77a; padding: 0 6px; vertical-align: middle; }
.att-tbl td.d { text-align: center; font-size: 13px; line-height: 1.35; }
.att-tbl td.d small { display: block; color: var(--gray-2); font-size: 11px; }
.att-tbl td.d.bad { background: #fff3f4; } .att-tbl td.d.chk { background: #fff8e6; } .att-tbl td.d.okc { background: #f1faf4; }
.seg { display: inline-flex; border: 1px solid #ccc; } .seg button { border: 0; background: #fff; padding: 0 14px; height: 38px; font-weight: 700; cursor: pointer; } .seg button.on { background: var(--navy); color: #fff; }
.post { background: #fff; border: 1px solid var(--line); padding: 16px 18px; margin-bottom: 10px; }
.post .h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.post .c { white-space: pre-wrap; margin: 10px 0; font-size: 14px; }
.post .ctl { display: grid; grid-template-columns: 160px 1fr; gap: 8px; align-items: start; }
.post .ctl textarea { height: 70px; }
@media (max-width: 900px) { .post .ctl { grid-template-columns: 1fr; } }
.ops-day { display: grid; grid-template-columns: 96px 1fr auto; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); background: #fff; }
.ops-day.late { background: #fff3f4; } .ops-day.done { opacity: .5; } .ops-day .w { font-size: 13px; color: var(--gray-1); }
.ops-day .t b { margin-right: 6px; } .ops-day .t small { color: var(--gray-2); margin-left: 6px; }
.cls { display: inline-block; font-size: 11px; font-weight: 800; padding: 0 6px; border: 1px solid; margin-left: 4px; white-space: nowrap; }
.cls.ai { color: #1d4ed8; background: #eef4ff; } .cls.me { color: #b45309; background: #fff4e0; } .cls.auto { color: #15803d; background: #effaf2; } .cls.inst { color: #555; background: #f3f3f3; } .cls.prof { color: #6d28d9; background: #f4efff; } .cls.drop { color: #999; background: #fafafa; text-decoration: line-through; }
.ops-grp { margin: 22px 0 6px; font-weight: 800; font-size: 15px; }
.ops-row td.n { white-space: normal; max-width: 420px; cursor: pointer; } .ops-row.done td { color: var(--gray-2); } .ops-row.done td.n { text-decoration: line-through; }
.ops-more td { white-space: normal; background: #fafbff; font-size: 13px; line-height: 1.6; max-width: none; }
.ops-more textarea { width: 100%; height: 56px; margin-top: 6px; }
@media (max-width: 900px) { .ops-day { grid-template-columns: 1fr auto; } .ops-day .w { grid-column: 1 / -1; } }
/* 모달 */
.modal { position: fixed; inset: 0; background: rgba(14,21,45,.55); display: none; align-items: flex-start; justify-content: center; z-index: 50; padding: 40px 16px; overflow: auto; }
.modal.open { display: flex; }
.modal .box { background: #fff; width: 100%; max-width: 640px; border-top: 4px solid var(--navy); }
.modal header { padding: 18px 22px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
.modal header b { font-size: 18px; }
.modal header button { border: 0; background: none; font-size: 22px; cursor: pointer; }
.modal .body { padding: 8px 22px 4px; max-height: 64vh; overflow: auto; }
.f { display: grid; grid-template-columns: 150px 1fr; border-bottom: 1px solid var(--line); align-items: center; }
.f label { font-weight: 700; font-size: 14px; padding: 10px 0; }
.f input, .f select, .f textarea { width: 100%; margin: 6px 0; }
.modal footer { padding: 14px 22px; display: flex; gap: 8px; justify-content: flex-end; border-top: 1px solid var(--line); background: var(--bg-soft); }
.modal footer .sp { flex: 1; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--navy-deep); color: #fff; padding: 12px 22px; font-weight: 700; z-index: 60; display: none; max-width: 90vw; }
.toast.show { display: block; }
.loading { padding: 60px; text-align: center; color: var(--gray-2); }
/* ───── 문자 발송 (JVI 선물문자 형식) ───── */
.sms-head { display: grid; grid-template-columns: 1fr 380px; gap: 14px; margin-bottom: 14px; }
.sms-hello { background: linear-gradient(90deg, #fff7ec, #f4f0ff); border: 1px solid #efe6ff; border-radius: 18px; padding: 18px 22px; display: flex; gap: 14px; align-items: center; }
.sms-hello b { display: block; font-size: 16px; color: var(--jnavy); }
.sms-hello span { font-size: 13px; color: var(--muted); }
.sms-how { background: var(--jnavy); color: #fff; border-radius: 18px; padding: 16px 20px; font-size: 13px; line-height: 1.7; }
.sms-how b { display: block; font-size: 15px; margin-bottom: 4px; }
.sms-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
.sms-stat { background: #fff; border: 1px solid #e6e6ef; border-radius: 16px; padding: 14px 18px; }
.sms-stat small { color: var(--muted); font-size: 13px; }
.sms-stat b { display: block; font-size: 28px; font-weight: 800; color: var(--violet); line-height: 1.35; }
.sms-stat b span { font-size: 14px; color: var(--muted); font-weight: 400; margin-left: 3px; }
.sms-stat em { font-style: normal; font-size: 12px; color: #9a9db2; }
.sms-grid { display: grid; grid-template-columns: 300px 340px 1fr; gap: 14px; align-items: start; }
.sms-col { background: #fff; border: 1px solid #e6e6ef; border-radius: 18px; overflow: hidden; }
.sms-col-h { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--cell); font-weight: 800; font-size: 14px; color: var(--jnavy); }
.sms-col-h span { font-size: 12px; font-weight: 400; color: var(--muted); }
.sms-list { padding: 8px; display: grid; gap: 4px; max-height: 620px; overflow: auto; }
.sms-grp { font-size: 11px; font-weight: 700; letter-spacing: .14em; color: #a4a7ba; padding: 10px 8px 4px; }
.sms-pick { display: flex; align-items: center; gap: 10px; width: 100%; border: 1px solid transparent; background: transparent; border-radius: 12px; padding: 8px 10px; text-align: left; cursor: pointer; }
.sms-pick:hover { background: var(--cell); }
.sms-pick[aria-pressed="true"] { background: var(--lav); border-color: #dccfff; }
.sms-pick .qk-wrap { width: 36px; flex: none; }
.sms-pick b { display: block; font-size: 14px; }
.sms-pick small { display: block; font-size: 12px; color: var(--muted); line-height: 1.35; }
.phone { background: var(--jnavy); border-radius: 28px; padding: 14px 12px 14px; color: #fff; }
.phone-h { display: flex; justify-content: space-between; align-items: center; padding: 2px 8px 10px; font-size: 13px; }
.phone-h b { font-size: 14px; }
.phone-h span { font-size: 12px; opacity: .8; }
.phone-h span.over { color: #ff9aa6; opacity: 1; font-weight: 700; }
.bubble { background: #fff; color: var(--ink); border-radius: 18px; padding: 14px; min-height: 360px; }
.bubble .tag { display: inline-block; background: var(--lav); color: var(--violet-2); font-size: 12px; font-weight: 700; border-radius: 20px; padding: 2px 10px; margin-bottom: 8px; }
.bubble textarea { border: 0; width: 100%; min-height: 330px; padding: 0; font-size: 14px; line-height: 1.7; resize: vertical; outline: none; }
.phone-f { font-size: 12px; opacity: .75; padding: 8px 8px 0; }
.rcpt { padding: 14px 16px; }
.rcpt .ctl { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.rcpt select { border-radius: 10px; height: 36px; border-color: #ddd; }
.rcpt .cnt { font-size: 13px; color: var(--violet-2); font-weight: 700; margin-left: auto; align-self: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 300px; overflow: auto; padding: 2px; }
.chip { border: 1px solid #e3e3ee; border-radius: 20px; padding: 3px 12px; font-size: 13px; background: #fff; cursor: pointer; }
.chip.off { text-decoration: line-through; opacity: .45; }
.chip small { color: var(--muted); margin-left: 4px; }
.sms-btn { width: 100%; height: 50px; border: 0; border-radius: 14px; background: linear-gradient(90deg, var(--violet), var(--violet-2)); color: #fff; font-weight: 800; font-size: 15px; cursor: pointer; margin-top: 12px; }
.sms-btn.sub2 { background: #fff; color: var(--violet-2); border: 1px solid #dccfff; height: 44px; margin-top: 8px; }
.sms-btn.done { background: var(--jnavy-2); }
.sms-tip { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.65; }
.sms-log { margin-top: 14px; }
.sms-log div { font-size: 12.5px; padding: 6px 0; border-bottom: 1px dashed #eee; color: var(--muted); }
.sms-log b { color: var(--jnavy); font-weight: 700; }
/* 쿼카 */
.qk-wrap { display: block; aspect-ratio: 1; }
.qk-wrap svg { display: block; width: 100%; height: 100%; overflow: visible; }
.qk .ey { transform-box: fill-box; transform-origin: center; }
.qk-hd { transform-box: view-box; transform-origin: 60px 110px; }
@media (prefers-reduced-motion: no-preference) {
  .qk .ey { animation: qk-blink 4.8s infinite; }
  .qk-hop .qk-hd { animation: qk-hop 2.4s infinite; }
  .qk-live .qk-hd { animation: qk-breath 5s infinite ease-in-out; }
}
.qk .qm2 { opacity: 0; }
@keyframes qk-blink { 0%, 93%, 100% { transform: scaleY(1); } 95.5% { transform: scaleY(.1); } }
@keyframes qk-breath { 0%, 100% { transform: scale(1, 1); } 45%, 55% { transform: scale(1.012, 1.026); } }
@keyframes qk-hop { 0%, 58%, 100% { transform: translate(0, 0) scale(1, 1); } 64% { transform: translate(0, 1px) scale(1.04, .95); } 72% { transform: translate(0, -6px) scale(.98, 1.03); } 80% { transform: translate(0, 0) scale(1.03, .97); } 86% { transform: translate(0, 0) scale(1, 1); } }
@media (max-width: 1280px) { .sms-grid { grid-template-columns: 260px 1fr; } .sms-grid > :last-child { grid-column: 1 / -1; } }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .side { position: static; height: auto; display: flex; overflow-x: auto; padding: 0; border-right: 0; border-bottom: 1px solid var(--line); }
  .side .grp { display: none; }
  .side button { width: auto; white-space: nowrap; border-left: 0; border-bottom: 3px solid transparent; padding: 12px 14px; }
  .side button.on { border-bottom-color: var(--navy); }
  main { padding: 20px 16px 60px; }
  .stats, .sms-stats { grid-template-columns: 1fr 1fr; }
  .grid2, .sms-head, .sms-grid { grid-template-columns: 1fr; }
  .f { grid-template-columns: 1fr; }
  .top b em { display: none; }
}
</style>
</head>
<body>
<div class="top">
  <b>연구하는 교사되기 2027<em>운영자 관리</em></b>
  <div class="sp"></div>
  <span id="who"></span>
  <a class="pill" id="ssLink" href="#" target="_blank">원본 시트</a>
  <a class="pill" id="siteLink" href="#" target="_blank">연수생 사이트</a>
</div>
<div class="layout">
  <nav class="side" id="side">
    <div class="grp">운영</div>
    <button data-tab="dash">대시보드</button>
    <button data-tab="ops">운영 업무표 · D-day <span class="cnt" id="cntOps" hidden></span></button>
    <button data-tab="apps">신청자 명단</button>
    <button data-tab="reqs">셀프신청 처리 <span class="cnt" id="cntReq" hidden></span></button>
    <button data-tab="check">이수정보 점검 <span class="cnt" id="cntChk" hidden></span></button>
    <button data-tab="attend">출결 · 이수 판정</button>
    <button data-tab="board">게시판 (Q&amp;A·환불) <span class="cnt" id="cntBoard" hidden></span></button>
    <button data-tab="sms">문자 발송</button>
    <button data-tab="roster">이수생관리부</button>
    <div class="grp">안내</div>
    <button data-tab="notice">공지사항</button>
    <button data-tab="faq">FAQ</button>
    <button data-tab="sched">연수 일정</button>
    <div class="grp">강사</div>
    <button data-tab="tsched">강사 일정</button>
    <button data-tab="tinfo">강사 정보 (비공개)</button>
    <button data-tab="tdoc">위촉공문 자료</button>
    <div class="grp">기타</div>
    <button data-tab="settings">설정</button>
    <button data-tab="logs">문자 기록</button>
  </nav>
  <main id="main"><div class="loading">불러오는 중…</div></main>
</div>
<div class="modal" id="modal"><div class="box"><header><b id="mTitle"></b><button onclick="closeModal()" aria-label="닫기">×</button></header><div class="body" id="mBody"></div><footer id="mFoot"></footer></div></div>
<div class="toast" id="toast"></div>

<script>
/* 쿼카 아이콘 (JVI 레트로 대시보드에서 가져옴) */
